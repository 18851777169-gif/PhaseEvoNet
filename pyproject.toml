[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-evonet"
version = "0.1.0"
description = "Research code for version-aware phase-stability benchmarking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0",
  "emmet-core>=0.83.8,<0.87; python_version < '3.11'",
  "emmet-core>=0.87.1; python_version >= '3.11'",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "patsy>=1.0",
  "pillow>=10.0",
  "pymatgen>=2024.1",
  "pyarrow>=20.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
phase-evo = "phase_evonet.cli:main"

[project.urls]
Repository = "https://github.com/18851777169-gif/PhaseEvoNet"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
